seed: 1203
output_dir: artifacts/robust_160_gcr_gan
dataset:
  path: examples/benchmark_160/papers.jsonl
  format: json
  train_ratio: 0.80
network:
  undirected: true
  include_coauthor_edges: true
specter:
  model_name: allenai/specter
  fine_tune: false
  batch_size: 16
  max_length: 128
  expected_dimension: 768
  deduplicate_texts: true
gcr_gan:
  # Keep the paper-sized architecture. The 160-paper benchmark provides 128
  # candidates; only the epoch count is reduced for CPU validation.
  latent_dim: 150
  noise_dim: 150
  generator_hidden_dim: 300
  corruption_probability: 0.30
  gradient_penalty: 10.0
  learning_rate: 0.001
  batch_size: 32
  epochs: 1
  discriminator_steps: 1
  generator_steps: 1
  checkpoint_every_epochs: 1
  resume_from_checkpoint: false
  max_dense_batch_mb: 2048
evaluation:
  score_variant: semantic
  map_k: 10
  ndcg_k: 100
  recall_ks: [20, 40, 60, 80, 100]
  query_batch_size: 32
