seed: 1203
output_dir: artifacts/gcr_gan_dblp_v12

dataset:
  # Download DBLP-V12 from https://originalstatic.aminer.cn/misc/dblp.v12.7z
  # and point this path to the extracted JSON/JSONL file.
  path: data/raw/dblp_v12.json
  format: auto
  train_ratio: 0.80

network:
  # Directionality is not reported. Symmetric relation rows are the default
  # reconstruction; change to false for directed citation/metadata edges.
  undirected: true
  include_coauthor_edges: true

specter:
  model_name: allenai/specter
  # Section 5.3 calls SPECTER pre-trained. Section 5.5 describes SPECTER's own
  # SciBERT fine-tuning but does not state a second DBLP-specific fine-tune.
  fine_tune: false
  epochs: 1  # Used only if optional corpus-specific fine-tuning is enabled.
  batch_size: 16
  learning_rate: 0.00002  # Paper does not report this optimizer value.
  margin: 1.0
  max_length: 512
  expected_dimension: 768
  deduplicate_texts: true  # Exact memoization for duplicate title/abstract strings.

gcr_gan:
  latent_dim: 150
  noise_dim: 150
  generator_hidden_dim: 300
  corruption_probability: 0.30
  gradient_penalty: 10.0
  learning_rate: 0.001
  batch_size: 64  # GAN batch size is not reported; override for reproduction.
  epochs: 100     # Training-iteration count S is not reported.
  discriminator_steps: 5
  generator_steps: 1
  checkpoint_every_epochs: 1
  resume_from_checkpoint: false
  # Guards only the explicitly materialized float32 input batch. The complete
  # node-by-node adjacency stays CSR; raise after checking device memory.
  max_dense_batch_mb: 2048

evaluation:
  # The prose around Eq. 8 requires topic/topic similarity; the printed third
  # term repeats the author matrix. Use literal_equation_8 to audit that typo.
  score_variant: semantic
  map_k: 10
  ndcg_k: 100  # Paper does not state its nDCG cutoff.
  recall_ks: [20, 40, 60, 80, 100]
  query_batch_size: 32
